name: CompatHelper
on:
  schedule:
    # Weekly (Mondays 00:00 UTC); was daily from the PkgTemplates default.
    - cron: 0 0 * * 1
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional SSH deploy key; leave unset to use GITHUB_TOKEN with the
          # permissions above (sufficient for public repos).
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main()'
